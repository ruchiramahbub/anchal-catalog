<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>আঁচল — পণ্যের কালেকশন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A2048;
    --maroon-dark:#591634;
    --maroon-soft:#F4E4EC;
    --gold:#C08A2E;
    --gold-soft:#F6ECD6;
    --teal:#1F4B4A;
    --teal-soft:#E3EEEC;
    --cream:#FBF3E7;
    --card:#FFFFFF;
    --ink:#2B1B1F;
    --ink-soft:#8a7378;
    --line:#E8DCCD;
    --good:#3E7A52;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#EDE2D0;
    font-family:'Hind Siliguri',sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.brand,.hero-title{font-family:'Baloo Da 2',sans-serif;}
  #app{max-width:480px;min-height:100vh;margin:0 auto;background:var(--cream);position:relative;padding-bottom:80px;box-shadow:0 0 40px rgba(0,0,0,0.08);}

  /* Sample banner */
  .sample-banner{background:var(--gold-soft);color:#6b4e12;font-size:12.5px;text-align:center;padding:8px 14px;border-bottom:1px solid #E5CE99;}

  /* Header / hero */
  header{background:var(--maroon);color:#fff;padding:26px 20px 24px;border-radius:0 0 20px 20px;}
  .brand-row{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:46px;height:46px;flex:none;border-radius:50%;background:var(--maroon-dark);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,0.35);}
  .brand{font-size:26px;font-weight:700;margin:0;}
  .tagline{font-size:13px;color:#EBD3DD;margin:3px 0 0;}
  .hero-note{margin-top:16px;font-size:13px;color:#F3DCE6;line-height:1.6;}

  main{padding:16px 16px 4px;}
  .view{display:none;}
  .view.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .search-bar{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;font-family:inherit;margin-bottom:10px;}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .chip{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .chip.active{background:var(--maroon);border-color:var(--maroon);color:#fff;}

  /* Product grid */
  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .product-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;}
  .product-card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--maroon-soft);}
  .product-card .thumb-placeholder{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--maroon-soft);color:var(--maroon);}
  .product-card.type-কামিজ .thumb-placeholder{background:var(--teal-soft);color:var(--teal);}
  .product-card.type-ওড়না .thumb-placeholder{background:var(--gold-soft);color:#8a5f10;}
  .pc-body{padding:9px 10px 11px;}
  .pc-name{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em;}
  .pc-tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:6px;font-weight:600;background:var(--maroon-soft);color:var(--maroon);margin-top:5px;}
  .pc-price{font-size:14.5px;font-weight:700;margin-top:6px;}
  .pc-stock{font-size:11px;color:var(--danger,#a8342f);margin-top:2px;}

  .empty-state{text-align:center;padding:44px 20px;color:var(--ink-soft);font-size:14px;line-height:1.7;grid-column:1/3;}
  .empty-state span{font-size:34px;display:block;margin-bottom:8px;}

  /* Theme grid */
  .theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .theme-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;}
  .theme-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--gold-soft);}
  .theme-card-placeholder{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:#8a5f10;font-size:28px;}
  .theme-card-body{padding:8px 10px;}
  .theme-card-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* Contact */
  .contact-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .contact-card h3{margin:0 0 10px;font-size:15px;}
  .contact-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .contact-row:last-child{border-bottom:none;}
  .contact-icon{width:34px;height:34px;flex:none;border-radius:50%;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;}
  .contact-link{color:var(--ink);text-decoration:none;font-weight:600;}
  .contact-empty{font-size:13px;color:var(--ink-soft);}

  /* Buttons */
  .btn{font-family:inherit;font-size:14.5px;font-weight:600;border-radius:10px;padding:11px 16px;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn-primary{background:var(--maroon);color:#fff;}
  .btn-whatsapp{background:#25D366;color:#fff;}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn-block{width:100%;}
  .btn-row{display:flex;gap:10px;margin-top:16px;flex-direction:column;}

  /* Bottom nav */
  .navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:6px 2px;color:var(--ink-soft);font-family:'Hind Siliguri',sans-serif;font-size:11.5px;cursor:pointer;}
  .navbtn svg{width:20px;height:20px;}
  .navbtn.active{color:var(--maroon);}

  /* Modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(43,27,31,0.45);z-index:50;align-items:flex-end;justify-content:center;}
  .modal-overlay.active{display:flex;}
  .modal{background:var(--cream);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));}
  .modal-handle{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px;}
  .modal h2{font-size:19px;margin:0 0 4px;}
  .modal-image{width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin:10px 0 14px;border:1px solid var(--line);}
  .modal-image-placeholder{width:100%;height:200px;border-radius:14px;margin:10px 0 14px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--maroon-soft);color:var(--maroon);}
  .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row span:first-child{color:var(--ink-soft);}
  .detail-row span:last-child{font-weight:600;text-align:right;}
  .modal-note{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-top:10px;}

  .loading-note, .error-note{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;line-height:1.8;}
</style>
</head>
<body>
<div id="app">

  <div id="sampleBanner" style="display:none;" class="sample-banner">এটি নমুনা ডেটা — "আঁচল খাতা" অ্যাপ থেকে ক্যাটালগ এক্সপোর্ট করে catalog-data.json ফাইলটি প্রতিস্থাপন করুন।</div>

  <header>
    <div class="brand-row">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 3C9 6 6 9 6 13a6 6 0 0012 0c0-4-3-7-6-10z" stroke="#E7B75C" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="14" r="2" stroke="#E7B75C" stroke-width="1.4"/>
        </svg>
      </div>
      <div>
        <p class="brand" id="shopNameEl">আঁচল</p>
        <p class="tagline" id="taglineEl">শাড়ী, কামিজ ও ওড়নার কালেকশন</p>
      </div>
    </div>
    <p class="hero-note">পছন্দের পণ্যে চাপুন, তারপর সরাসরি WhatsApp-এ অর্ডার করুন — কোনো অ্যাকাউন্ট লাগবে না।</p>
  </header>

  <main id="mainContent">
    <div class="loading-note" id="loadingNote">লোড হচ্ছে…</div>
  </main>

  <nav class="navbar" id="navbar" style="display:none;">
    <button class="navbtn active" data-view="products">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v3M8 6l4-3 4 3M4 10l8-4 8 4-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7z"/></svg>
      পণ্য
    </button>
    <button class="navbtn" data-view="themes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 1-1.8-.7-.6-.6-1.9.7-2.2h1.6a4 4 0 0 0 4-4A9 9 0 0 0 12 3z"/><circle cx="8" cy="10.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="10.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      থিম
    </button>
    <button class="navbtn" data-view="contact">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h2.6a1 1 0 0 1 .97.76l.8 3.2a1 1 0 0 1-.5 1.13L6.7 10.1a12 12 0 0 0 6.2 6.2l1-1.7a1 1 0 0 1 1.13-.5l3.2.8a1 1 0 0 1 .76.97v2.6a1.5 1.5 0 0 1-1.5 1.5A15.5 15.5 0 0 1 3 5.5z"/></svg>
      যোগাযোগ
    </button>
  </nav>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
(function(){
  "use strict";

  const bnDigits = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
  function bn(n){ return String(n).split('').map(c=>bnDigits[c]!==undefined?bnDigits[c]:c).join(''); }
  function groupBD(num){
    let n = Math.round(Number(num)||0);
    let s = String(n);
    if(s.length<=3) return s;
    let last3 = s.slice(-3);
    let rest = s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',');
    return rest+','+last3;
  }
  function taka(n){ return '৳'+bn(groupBD(n)); }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  let catalog = null;
  let currentView = 'products';
  let productFilter = 'সব';
  let productSearchTerm = '';

  async function init(){
    try{
      const res = await fetch('./catalog-data.json', {cache:'no-store'});
      if(!res.ok) throw new Error('not found');
      catalog = await res.json();
    }catch(e){
      showSetupNote();
      return;
    }
    if(catalog.shopName) document.getElementById('shopNameEl').textContent = catalog.shopName;
    if(catalog.tagline) document.getElementById('taglineEl').textContent = catalog.tagline;
    if(catalog.isSample) document.getElementById('sampleBanner').style.display = 'block';
    document.getElementById('navbar').style.display = 'flex';
    buildLayout();
    switchView('products');
  }

  function showSetupNote(){
    document.getElementById('mainContent').innerHTML = `
      <div class="error-note">
        <span style="font-size:34px;display:block;margin-bottom:10px;">📦</span>
        এখনো কোনো ক্যাটালগ ডেটা পাওয়া যায়নি।<br><br>
        "আঁচল খাতা" অ্যাপ থেকে ক্যাটালগ এক্সপোর্ট করে<br>
        <b>catalog-data.json</b> ফাইলটি এই পেজের (catalog.html) একই ফোল্ডারে রাখুন।
      </div>`;
  }

  function buildLayout(){
    document.getElementById('mainContent').innerHTML = `
      <div class="view active" id="view-products">
        <input class="search-bar" id="productSearch" placeholder="পণ্যের নাম খুঁজুন">
        <div class="chip-row" id="filterChips">
          <button class="chip active" data-type="সব">সব</button>
          <button class="chip" data-type="শাড়ী">শাড়ী</button>
          <button class="chip" data-type="কামিজ">কামিজ</button>
          <button class="chip" data-type="ওড়না">ওড়না</button>
          <button class="chip" data-type="অন্যান্য">অন্যান্য</button>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>
      <div class="view" id="view-themes">
        <div class="theme-grid" id="themeGrid"></div>
      </div>
      <div class="view" id="view-contact">
        <div class="contact-card">
          <h3>যোগাযোগ করুন</h3>
          <div id="contactBody"></div>
        </div>
      </div>
    `;
    document.getElementById('productSearch').addEventListener('input', e=>{ productSearchTerm=e.target.value; renderProducts(); });
    document.getElementById('filterChips').addEventListener('click', e=>{
      const chip = e.target.closest('.chip');
      if(!chip) return;
      productFilter = chip.dataset.type;
      document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.toggle('active', c===chip));
      renderProducts();
    });
    document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click', ()=>switchView(b.dataset.view)));
    renderProducts();
    renderThemes();
    renderContact();
  }

  function switchView(name){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+name).classList.add('active');
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
    currentView = name;
    window.scrollTo(0,0);
  }

  function thumbHtml(image, type){
    if(image) return `<img class="thumb" src="${image}" alt="">`;
    return `<div class="thumb-placeholder">👗</div>`;
  }

  function themeNameById(id){ const t=(catalog.themes||[]).find(x=>x.id===id); return t?t.name:null; }

  function productCardHtml(p){
    const outOfStock = Number(p.stock)<=0;
    return `<div class="product-card type-${p.type}" data-action="open-product" data-id="${p.id}">
      ${thumbHtml(p.image, p.type)}
      <div class="pc-body">
        <div class="pc-name">${escapeHtml(p.name)}</div>
        ${p.design?`<span class="pc-tag">${escapeHtml(p.design)}</span>`:''}
        <div class="pc-price">${taka(p.price)}</div>
        ${outOfStock?`<div class="pc-stock">স্টক শেষ</div>`:''}
      </div>
    </div>`;
  }

  function renderProducts(){
    let list = (catalog.products||[]).slice();
    if(productFilter!=='সব') list = list.filter(p=>p.type===productFilter);
    if(productSearchTerm.trim()){
      const q = productSearchTerm.trim().toLowerCase();
      list = list.filter(p=> p.name.toLowerCase().includes(q) || (p.design||'').toLowerCase().includes(q));
    }
    const el = document.getElementById('productGrid');
    if(!list.length){
      el.innerHTML = `<div class="empty-state"><span>👗</span>কোনো পণ্য পাওয়া যায়নি।</div>`;
      return;
    }
    el.innerHTML = list.map(productCardHtml).join('');
  }

  function themeCardHtml(t){
    return `<div class="theme-card" data-action="open-theme" data-id="${t.id}">
      ${t.image?`<img src="${t.image}" alt="">`:`<div class="theme-card-placeholder">🎨</div>`}
      <div class="theme-card-body"><div class="theme-card-name">${escapeHtml(t.name)}</div></div>
    </div>`;
  }

  function renderThemes(){
    const list = catalog.themes||[];
    const el = document.getElementById('themeGrid');
    if(!list.length){
      el.innerHTML = `<div class="empty-state" style="grid-column:1/3;"><span>🎨</span>এখনো কোনো থিম যোগ করা হয়নি।</div>`;
      return;
    }
    el.innerHTML = list.map(themeCardHtml).join('');
  }

  function waLink(phone, text){
    const clean = String(phone||'').replace(/[^0-9]/g,'');
    if(!clean) return null;
    return 'https://wa.me/'+clean+'?text='+encodeURIComponent(text);
  }
  function messengerLink(m){
    if(!m) return null;
    m = m.trim();
    if(m.startsWith('http')) return m;
    return 'https://m.me/'+m.replace(/^@/,'');
  }

  function renderContact(){
    const phone = catalog.phone || '';
    const messenger = catalog.messenger || '';
    const address = catalog.address || '';
    let rows = '';
    if(phone){
      rows += `<div class="contact-row"><div class="contact-icon">📞</div><a class="contact-link" href="tel:${escapeHtml(phone)}">${escapeHtml(phone)}</a></div>`;
    }
    if(messenger){
      rows += `<div class="contact-row"><div class="contact-icon">💬</div><a class="contact-link" href="${messengerLink(messenger)}" target="_blank" rel="noopener">Messenger-এ মেসেজ করুন</a></div>`;
    }
    if(address){
      rows += `<div class="contact-row"><div class="contact-icon">📍</div><span>${escapeHtml(address)}</span></div>`;
    }
    if(!rows){
      rows = `<div class="contact-empty">যোগাযোগের তথ্য এখনো যোগ করা হয়নি।</div>`;
    }
    document.getElementById('contactBody').innerHTML = rows;
    const wa = waLink(phone, 'আসসালামু আলাইকুম, আমি আপনার পেজ থেকে যোগাযোগ করছি।');
    if(wa){
      document.getElementById('contactBody').innerHTML += `<div class="btn-row"><a class="btn btn-whatsapp btn-block" href="${wa}" target="_blank" rel="noopener">WhatsApp-এ মেসেজ করুন</a></div>`;
    }
  }

  const overlay = document.getElementById('modalOverlay');
  const modalBody = document.getElementById('modalBody');
  function openModal(html){ modalBody.innerHTML = `<div class="modal-handle"></div>` + html; overlay.classList.add('active'); }
  function closeModal(){ overlay.classList.remove('active'); modalBody.innerHTML=''; }
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

  function openProductDetail(id){
    const p = (catalog.products||[]).find(x=>x.id===id);
    if(!p) return;
    const outOfStock = Number(p.stock)<=0;
    const themeName = p.themeId ? themeNameById(p.themeId) : null;
    const wa = waLink(catalog.phone, `আমি "${p.name}${p.design?(' - '+p.design):''}" পণ্যটি অর্ডার করতে চাই।`);
    const mgr = messengerLink(catalog.messenger);
    openModal(`
      ${p.image?`<img class="modal-image" src="${p.image}" alt="">`:`<div class="modal-image-placeholder">👗</div>`}
      <h2>${escapeHtml(p.name)}</h2>
      <div class="detail-row"><span>ধরন</span><span>${escapeHtml(p.type)}</span></div>
      ${p.design?`<div class="detail-row"><span>ডিজাইন/কোড</span><span>${escapeHtml(p.design)}</span></div>`:''}
      ${themeName?`<div class="detail-row"><span>থিম</span><span>${escapeHtml(themeName)}</span></div>`:''}
      <div class="detail-row"><span>দাম</span><span>${taka(p.price)}</span></div>
      <div class="detail-row"><span>স্টক</span><span>${outOfStock?'স্টক শেষ':'পাওয়া যাচ্ছে'}</span></div>
      ${p.note?`<p class="modal-note">${escapeHtml(p.note)}</p>`:''}
      <div class="btn-row">
        ${wa?`<a class="btn btn-whatsapp btn-block" href="${wa}" target="_blank" rel="noopener">WhatsApp-এ অর্ডার করুন</a>`:''}
        ${mgr?`<a class="btn btn-ghost btn-block" href="${mgr}" target="_blank" rel="noopener">Messenger-এ মেসেজ করুন</a>`:''}
        ${(!wa&&!mgr)?`<p class="contact-empty" style="text-align:center;">যোগাযোগের তথ্য এখনো যোগ করা হয়নি।</p>`:''}
        <button class="btn btn-ghost btn-block" id="btnCloseDetail">বন্ধ করুন</button>
      </div>
    `);
    document.getElementById('btnCloseDetail').onclick = closeModal;
  }

  function openThemeDetail(id){
    const t = (catalog.themes||[]).find(x=>x.id===id);
    if(!t) return;
    openModal(`
      ${t.image?`<img class="modal-image" src="${t.image}" alt="">`:`<div class="modal-image-placeholder">🎨</div>`}
      <h2>${escapeHtml(t.name)}</h2>
      ${t.note?`<p class="modal-note">${escapeHtml(t.note)}</p>`:''}
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="btnShowThemeProducts">এই থিমে তৈরি পণ্য দেখুন</button>
        <button class="btn btn-ghost btn-block" id="btnCloseDetail">বন্ধ করুন</button>
      </div>
    `);
    document.getElementById('btnCloseDetail').onclick = closeModal;
    document.getElementById('btnShowThemeProducts').onclick = ()=>{
      closeModal();
      productFilter = 'সব';
      productSearchTerm = '';
      switchView('products');
      const list = (catalog.products||[]).filter(p=>p.themeId===id);
      const el = document.getElementById('productGrid');
      document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.toggle('active', c.dataset.type==='সব'));
      document.getElementById('productSearch').value='';
      if(!list.length){
        el.innerHTML = `<div class="empty-state"><span>👗</span>এই থিমে এখনো কোনো পণ্য যোগ করা হয়নি।</div>`;
      } else {
        el.innerHTML = list.map(productCardHtml).join('');
      }
    };
  }

  document.getElementById('app').addEventListener('click', e=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(action==='open-product') openProductDetail(el.dataset.id);
    else if(action==='open-theme') openThemeDetail(el.dataset.id);
  });

  init();
})();
</script>
</body>
</html>
